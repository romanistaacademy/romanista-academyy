<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo Container with transparent background -->
  <defs>
    <style>
      .logo-text { font-family: Arial, sans-serif; font-weight: bold; text-anchor: middle; }
      .logo-circle { fill: none; stroke: #DC2626; stroke-width: 3; }
      .logo-text-main { font-size: 24px; fill: white; }
      .logo-text-sub { font-size: 10px; fill: white; }
    </style>
  </defs>
  
  <!-- Circular Badge Background (Transparent, with white R) -->
  <circle cx="100" cy="100" r="95" class="logo-circle"/>
  
  <!-- Main R Letter -->
  <text x="100" y="115" class="logo-text logo-text-main">R</text>
  
  <!-- Optional: Accent lines -->
  <line x1="50" y1="180" x2="150" y2="180" stroke="#DC2626" stroke-width="2" opacity="0.5"/>
  
  <!-- Note: This is a placeholder. The actual logo should be imported as PNG with transparent background -->
</svg>
